[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securescope"
version = "2.0.1"
description = "Web security posture scanner with evidence-backed findings, grades, and SARIF/JSON/HTML/Markdown reports for CI."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Moataz" }]
keywords = ["security", "web-security", "appsec", "security-headers", "csp", "cors", "tls", "sarif", "ci", "owasp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "rich>=13",
]

[project.optional-dependencies]
whois = ["python-whois>=0.9"]
dev = ["pytest>=7", "ruff>=0.4", "python-whois>=0.9"]

[project.urls]
Homepage = "https://github.com/mohamedmoatazsec/SecureScope"
Changelog = "https://github.com/mohamedmoatazsec/SecureScope/blob/main/CHANGELOG.md"
Issues = "https://github.com/mohamedmoatazsec/SecureScope/issues"

[project.scripts]
securescope = "securescope.cli:main"

[tool.setuptools.packages.find]
include = ["securescope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:securescope.checks.tls"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
