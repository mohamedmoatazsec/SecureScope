[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securescope"
version = "1.1.0"
description = "Web security posture assessment toolkit: headers, cookies, TLS, CORS, HTTP methods, recon, with HTML/JSON/CSV reports."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Moataz" }]
keywords = ["security", "web-security", "penetration-testing", "recon", "security-headers", "cors", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "rich>=13",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/mohamedmoatazsec/SecureScope"
Issues = "https://github.com/mohamedmoatazsec/SecureScope/issues"

[project.scripts]
securescope = "securescope.cli:main"

[tool.setuptools.packages.find]
include = ["securescope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
