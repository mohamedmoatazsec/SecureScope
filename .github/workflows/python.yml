name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke-test the console script
        run: |
          securescope --version
          securescope --list-checks
          securescope --help

  action:
    name: Self-test the GitHub Action
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Start a local target
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory tests >/dev/null 2>&1 &
          sleep 1
      - name: Scan it with the action (must not fail the job on this fixture)
        uses: ./
        with:
          target: http://127.0.0.1:8000/
          fail-on: ""
          formats: "json sarif md html"
      - name: Reports exist
        run: ls -la securescope-reports && test -s securescope-reports/securescope-report.sarif

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t securescope:ci .
      - run: docker run --rm securescope:ci --version
