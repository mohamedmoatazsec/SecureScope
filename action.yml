name: "SecureScope scan"
description: "Scan a web application's security posture (headers, CSP, cookies, TLS, CORS) and fail the job on regressions."
author: "Mohamed Moataz"
branding:
  icon: "shield"
  color: "yellow"

inputs:
  target:
    description: "URL(s) to scan, space separated (https:// is assumed for bare hostnames)"
    required: true
  fail-on:
    description: "Fail the job if any finding is at least this severity: critical, high, medium, low. Empty = never fail."
    required: false
    default: "high"
  baseline:
    description: "Path to a previous JSON report; when set, only findings that are new relative to it can fail the job"
    required: false
    default: ""
  formats:
    description: "Report formats to write, space separated: json html md sarif csv"
    required: false
    default: "json sarif md"
  output:
    description: "Directory for the report files"
    required: false
    default: "securescope-reports"
  extra-args:
    description: "Any extra CLI flags, e.g. --skip-checks ports --timeout 20 -H 'Authorization: Bearer x'"
    required: false
    default: ""
  python-version:
    description: "Python version to run the scanner with"
    required: false
    default: "3.12"

outputs:
  report-dir:
    description: "Directory containing the reports"
    value: ${{ inputs.output }}
  exit-code:
    description: "SecureScope exit code (0 pass, 2 findings at/above fail-on)"
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SecureScope
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan
      id: scan
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        FORMATS: ${{ inputs.formats }}
        OUTPUT: ${{ inputs.output }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        # Inputs arrive as environment variables so their contents are data, not shell code.
        set +e
        read -r -a targets <<< "$TARGET"
        read -r -a formats <<< "$FORMATS"
        args=()
        for f in "${formats[@]}"; do args+=(-f "$f"); done
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        # extra-args is the one input that is deliberately shell syntax (it needs quoting for -H values);
        # it is written by the workflow author, who already controls the job.
        eval "extra=($EXTRA_ARGS)"
        securescope "${targets[@]}" "${args[@]}" -o "$OUTPUT" --no-color "${extra[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$OUTPUT/securescope-report.md" ]; then
          cat "$OUTPUT/securescope-report.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $code
